<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Gestion de produit</title>
  <link rel="stylesheet" href="style.css"/>
  <script src="vue.global.prod.js"></script>
<script src="axios.min.js"></script>
<script src="chart.umd.min.js"></script>
  <style>
    body { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; }
    .login-wrap {
      position:relative; z-index:1;
      width:100%; max-width:420px; padding:0 16px;
      animation: fadeUp 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:none} }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 36px;
      box-shadow: 0 32px 64px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.03);
    }
    .brand-icon {
      width:56px; height:56px; margin:0 auto 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius:16px;
      display:flex; align-items:center; justify-content:center;
      font-size:26px;
      box-shadow: 0 8px 24px rgba(59,130,246,0.35);
    }
    .brand-title {
      font-family:'Syne',sans-serif; font-size:12px; font-weight:700;
      letter-spacing:0.14em; text-transform:uppercase;
      color:var(--accent); text-align:center; margin-bottom:5px;
    }
    .brand-sub {
      font-family:'Syne',sans-serif; font-size:18px; font-weight:800;
      color:var(--text); text-align:center; margin-bottom:28px;
      line-height:1.3;
    }
    .divider { height:1px; background:var(--border); margin:0 0 24px; }
    .field { margin-bottom:16px; }
    .field label {
      display:block; font-size:11px; font-weight:600;
      letter-spacing:0.09em; text-transform:uppercase;
      color:var(--muted); margin-bottom:7px;
    }
    .field input {
      width:100%; padding:11px 14px;
      background:rgba(255,255,255,0.04);
      border:1px solid var(--border); border-radius:9px;
      color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px;
      outline:none; transition:border-color 0.18s,box-shadow 0.18s;
    }
    .field input:focus {
      border-color:var(--accent);
      box-shadow:0 0 0 3px rgba(59,130,246,0.13);
    }
    .field input::placeholder { color:var(--muted); }
    .btn-full {
      width:100%; padding:12px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border:none; border-radius:9px; color:#fff;
      font-family:'Syne',sans-serif; font-size:14px; font-weight:700;
      cursor:pointer; margin-top:4px;
      transition:opacity 0.18s,transform 0.15s;
      box-shadow:0 4px 18px rgba(59,130,246,0.3);
    }
    .btn-full:hover:not(:disabled) { opacity:0.88; transform:translateY(-1px); }
    .btn-full:disabled { opacity:0.45; cursor:not-allowed; }
    .hint {
      text-align:center; margin-top:18px;
      font-size:12px; color:var(--muted);
    }
    .hint code {
      background:rgba(255,255,255,0.07); padding:1px 6px;
      border-radius:4px; color:var(--accent); font-size:12px;
    }
    .footer-login { margin-top:20px; text-align:center; font-size:11px; color:var(--muted); }
    .footer-login strong { color:rgba(255,255,255,0.2); }
  </style>
</head>
<body>
  <div class="bg-fx"></div>
  <div class="bg-grid"></div>

  <div class="login-wrap">
    <div id="app">
      <div class="login-card">
        <div class="brand-icon">📦</div>
        <div class="brand-title">Connexion</div>
        <div class="brand-sub">Accès au espaces des gestion</div>
        <div class="divider"></div>

        <div class="field">
          <label>Identifiant</label>
          <input v-model="login" type="text" placeholder="Entrez votre login" @keyup.enter="connecter" autofocus/>
        </div>
        <div class="field">
          <label>Mot de passe</label>
          <input v-model="password" type="password" placeholder="••••••••" @keyup.enter="connecter"/>
        </div>

        <button class="btn-full" @click="connecter" :disabled="loading">
          <span v-if="loading"><span class="spin" style="border-top-color:#fff"></span> Connexion…</span>
          <span v-else>Se connecter →</span>
        </button>

        <div v-if="msg" :class="['alert', ok?'alert-success':'alert-error']" style="margin-top:14px;">
          {{ ok ? '✅' : '❌' }} {{ msg }}
        </div>

        <div class="hint">
       
        </div>
      </div>
      <div class="footer-login"><strong></strong> GestionProduit</div>
    </div>
  </div>

  <script>
    const { createApp } = Vue;
    createApp({
      data() { return { login:'', password:'', msg:'', ok:false, loading:false }; },
      mounted() {
        if (localStorage.getItem('av_auth')) window.location.href = 'ajout.html';
      },
      methods: {
        async connecter() {
          if (!this.login.trim() || !this.password.trim()) {
            this.msg = 'Veuillez remplir tous les champs.'; this.ok = false; return;
          }
          this.loading = true; this.msg = '';
          try {
            const r = await axios.post(
              'http://localhost/AurelienVinciance/backend/auth.php',
              { login: this.login.trim(), password: this.password }
            );
            if (r.data.success) {
              localStorage.setItem('av_auth', JSON.stringify(r.data.user));
              this.msg = r.data.message; this.ok = true;
              setTimeout(() => window.location.href = 'ajout.html', 700);
            }
          } catch(e) {
            this.msg = e.response?.data?.message || 'Connexion échouée'; this.ok = false;
          } finally { this.loading = false; }
        }
      }
    }).mount('#app');
  </script>
</body>
</html>
